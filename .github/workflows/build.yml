name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate bundled puzzle catalog
        run: |
          python3 data-check/validate_catalog.py app/src/main/assets/puzzles.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          bundled = json.loads(Path("app/src/main/assets/puzzles.json").read_text(encoding="utf-8"))
          mirror = json.loads(Path("data-check/puzzles.json").read_text(encoding="utf-8"))
          if bundled != mirror:
              raise SystemExit("FAIL: data-check/puzzles.json differs from the catalog bundled in the app")
          print(f"PASS: validation mirror matches the bundled catalog ({len(bundled)} records)")
          PY

      - name: Verify catalog addresses and public keys
        run: python3 data-check/verify_public_keys.py app/src/main/assets/puzzles.json

      - name: Test bundled catalog validator
        run: python3 -m unittest discover -s data-check -p 'test_*.py'

      - name: Test sourced puzzle-data schema validator
        run: python3 -m unittest discover -s data/puzzles -p 'test_*.py'

      - name: Audit bundled native CLI contract (static strings only)
        run: python3 data-check/audit_native_engine.py app/src/main/jniLibs/arm64-v8a/libkangaroo.so

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root was not found on the runner."
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure stable debug signing key (optional)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          KANGAROO_DEBUG_KEYSTORE_BASE64: ${{ secrets.KANGAROO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ -n "${KANGAROO_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KANGAROO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            if ! keytool -list -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::The configured KANGAROO_DEBUG_KEYSTORE_BASE64 is not a usable Android debug keystore with the expected alias and password."
              exit 1
            fi
            echo "KANGAROO_STABLE_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "::notice::Loaded the repository's stable debug signing key."
          else
            echo "KANGAROO_STABLE_DEBUG_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::KANGAROO_DEBUG_KEYSTORE_BASE64 is not configured. The runner-generated debug signing key may vary across runs, so this APK may not update an APK signed by a different run."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Summarize unit-test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          parse_errors = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))
              except (ET.ParseError, OSError, ValueError) as exc:
                  message = f"Could not parse {path}: {exc}"
                  print(message)
                  parse_errors.append(message)
          summary = (
              "## Android verification summary\n\n"
              f"- JUnit XML files found: **{len(files)}**\n"
              f"- Tests: **{totals['tests']}**\n"
              f"- Failures: **{totals['failures']}**\n"
              f"- Errors: **{totals['errors']}**\n"
              f"- Skipped: **{totals['skipped']}**\n"
              "- Build gates: puzzle-catalog structure/range checks, unit tests, Android lint, "
              "static native CLI contract strings, debug APK build, ARM64 native-library packaging/ELF check, and APK SHA-256 verification.\n"
              "- Device-only behavior (real hardware, thermal behavior, and native persistence "
              "semantics) is not proven by CI.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          if not files:
              raise SystemExit("Verification failed: no JUnit XML reports were produced.")
          if totals["tests"] <= 0:
              raise SystemExit("Verification failed: JUnit reports contain zero tests.")
          if parse_errors:
              raise SystemExit("Verification failed: one or more JUnit XML reports could not be parsed.")
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kangaroo-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native engine is packaged for ARM64
        run: |
          python3 - <<'PY'
          import struct
          import zipfile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          native_path = "lib/arm64-v8a/libkangaroo.so"
          with zipfile.ZipFile(apk) as archive:
              try:
                  data = archive.read(native_path)
              except KeyError:
                  raise SystemExit(f"Verification failed: {native_path} is missing from APK")
          if len(data) < 64:
              raise SystemExit("Verification failed: ELF64 header is truncated")
          if data[:4] != b"\x7fELF":
              raise SystemExit("Verification failed: native library does not have ELF magic")
          if data[4] != 2:
              raise SystemExit(f"Verification failed: expected ELF64 class (2), got {data[4]}")
          if data[5] != 1:
              raise SystemExit(f"Verification failed: expected little-endian ELF (1), got {data[5]}")
          machine = struct.unpack_from("<H", data, 18)[0]
          if machine != 183:
              raise SystemExit(f"Verification failed: expected AArch64 e_machine=183, got {machine}")
          elf_type = struct.unpack_from("<H", data, 16)[0]
          if elf_type not in (2, 3):  # ET_EXEC or ET_DYN (PIE)
              raise SystemExit(
                  f"Verification failed: ELF type {elf_type} is not executable/PIE"
              )
          entry_point = struct.unpack_from("<Q", data, 24)[0]
          if entry_point == 0:
              raise SystemExit("Verification failed: ELF entry point is zero; not a runnable executable")

          # Android 15/16 16 KB page-size readiness: all PT_LOAD segments must
          # advertise at least 16 KB alignment and congruent file/virtual offsets.
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phentsize = struct.unpack_from("<H", data, 54)[0]
          phnum = struct.unpack_from("<H", data, 56)[0]
          if phentsize < 56 or phnum == 0 or phoff + phentsize * phnum > len(data):
              raise SystemExit("Verification failed: invalid ELF64 program-header table")
          page_size = 16 * 1024
          load_segments = []
          has_executable_load_segment = False
          for index in range(phnum):
              entry = phoff + index * phentsize
              p_type = struct.unpack_from("<I", data, entry)[0]
              if p_type != 1:  # PT_LOAD
                  continue
              p_flags = struct.unpack_from("<I", data, entry + 4)[0]
              p_offset = struct.unpack_from("<Q", data, entry + 8)[0]
              p_vaddr = struct.unpack_from("<Q", data, entry + 16)[0]
              p_align = struct.unpack_from("<Q", data, entry + 48)[0]
              load_segments.append((p_offset, p_vaddr, p_align))
              if p_flags & 0x1:  # PF_X
                  has_executable_load_segment = True
              if p_align < page_size:
                  raise SystemExit(
                      f"Verification failed: PT_LOAD {index} alignment {p_align:#x} "
                      "is below 16 KB"
                  )
              if p_offset % page_size != p_vaddr % page_size:
                  raise SystemExit(
                      f"Verification failed: PT_LOAD {index} file/virtual offsets "
                      "are not congruent modulo 16 KB"
                  )
          if not load_segments:
              raise SystemExit("Verification failed: ELF contains no PT_LOAD segments")
          if not has_executable_load_segment:
              raise SystemExit("Verification failed: ELF has no executable PT_LOAD segment")
          print(
              f"Verified {native_path}: ELF64 AArch64 executable/PIE; entry point "
              f"{entry_point:#x}; {len(load_segments)} PT_LOAD segments aligned for 16 KB pages"
          )
          PY

      - name: Generate APK SHA-256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Verify APK SHA-256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum --check app-debug.apk.sha256

      - name: Record APK signing certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root was not found while checking APK signing."
            exit 1
          fi
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CERTS="app/build/outputs/apk/debug/app-debug.apk.certs.txt"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found at $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$CERTS"
          cat "$CERTS"
          FINGERPRINT="$(awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$CERTS")"
          if [[ -z "$FINGERPRINT" ]]; then
            echo "::error::Could not read the APK signer SHA-256 certificate fingerprint."
            exit 1
          fi
          {
            echo "## APK signing certificate"
            echo
            echo "- Signer certificate SHA-256: `$FINGERPRINT`"
            echo "- Stable CI debug keystore configured: **${KANGAROO_STABLE_DEBUG_SIGNING:-false}**"
            echo "- APK checksum validates file integrity; APK certificate fingerprint identifies the signer used for Android install/update compatibility."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: kangaroo-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.certs.txt
          retention-days: 14
