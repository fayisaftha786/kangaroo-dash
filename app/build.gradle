plugins { id 'com.android.application' }

def kangarooCommit = System.getenv("GITHUB_SHA")
if (!kangarooCommit) {
    try {
        def process = ["git", "rev-parse", "--verify", "HEAD"].execute(null, rootDir)
        kangarooCommit = process.text.trim()
    } catch (Exception ignored) {
        kangarooCommit = "local"
    }
}
def kangarooCommitShort = (kangarooCommit ==~ /[0-9a-fA-F]{40}/)
        ? kangarooCommit.substring(0, 12) : "local"
android {
    buildFeatures {
        buildConfig true
    }
    namespace 'app.kangaroodash'
    compileSdk 36
    defaultConfig {
        applicationId 'app.kangaroodash'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '2.4'
        buildConfigField "String", "GIT_COMMIT_SHORT", "\"${kangarooCommitShort}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
